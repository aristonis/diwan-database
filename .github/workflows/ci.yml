name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The build compiles on 21 and tests on 17, 21 and 25 through Gradle toolchains.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      # The PostgreSQL tests start their own server from these binaries; required, so they cannot skip silently.
      - name: Find PostgreSQL
        run: echo "DIWAN_PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Check
        env:
          DIWAN_PG_REQUIRED: "1"
        run: >
          ./gradlew check --continue
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "*/build/reports/tests/"
          retention-days: 7
