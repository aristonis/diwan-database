name: Feature request
description: Ask for a Laravel feature Diwan does not have yet, or something new.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: The problem first, then the API you have in mind.
    validations:
      required: true
  - type: input
    id: laravel
    attributes:
      label: Laravel equivalent, if any
      placeholder: Builder::upsert()
